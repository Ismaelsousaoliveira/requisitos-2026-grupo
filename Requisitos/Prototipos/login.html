<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login — GAC</title>
<link rel="stylesheet" href="style.css"></head>
<body class="bg-login">
<div class="login-card">
    <div class="logo-area">
        <div class="logo-mark">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
        </div>
        <h1>GAC</h1>
        <p>Sistema de Gerenciamento de<br>Locação de Projetores</p>
    </div>
    <form>
        <div class="field">
            <label>E-mail Institucional</label>
            <input type="email" placeholder="seu@email.instituicao.edu" value="professor@cct.instituicao.edu">
        </div>
        <div class="field">
            <label>Senha</label>
            <input type="password" value="********">
        </div>
        <button class="btn btn-primary" onclick="alert('Login realizado! Redirecionando...'); return false;">Acessar</button>
        <p class="login-link">Esqueceu sua senha?</p>
    </form>
</div>
<div class="wireframe-label">Login</div>
</body>
</html>
