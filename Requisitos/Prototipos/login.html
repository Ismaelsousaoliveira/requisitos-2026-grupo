<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login — GAC</title>
<link rel="stylesheet" href="style.css"></head>
<body class="bg-blue">
<div class="login-card">
    <div class="logo-area">
        <div class="logo-icon">📽️</div>
        <h1>GAC</h1>
        <p>Sistema de Gerenciamento de Locação de Projetores</p>
    </div>
    <form>
        <div class="field">
            <label>E-mail Institucional</label>
            <input type="email" placeholder="seu@email.instituicao.edu" value="professor@cct.instituicao.edu">
        </div>
        <div class="field">
            <label>Senha</label>
            <input type="password" value="********">
        </div>
        <button class="btn btn-primary" onclick="alert('Login realizado! Redirecionando...'); return false;">Entrar</button>
        <p class="link">Esqueceu sua senha?</p>
    </form>
</div>
<div class="wireframe-label">🔐 Tela de Login — IU01</div>
</body>
</html>
