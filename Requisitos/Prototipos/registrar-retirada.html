<!DOCTYPE html><html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Registrar Retirada — GAC</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div><h1>Registrar Retirada</h1><div class="page-desc">Localize e confirme a retirada de um projetor.</div></div><span class="badge badge-func">Funcionário CCT</span></header>
<div class="form-card">
  <div class="form-group"><label>Buscar Solicitação</label><input type="text" placeholder="Nº da solicitação ou nome do professor..." value="2024"></div>
  <div class="detail-box">
    <h3>Solicitação #2024</h3>
    <div class="detail-item"><span class="lbl">Professor</span><span class="val">Maria Souza</span></div>
    <div class="detail-item"><span class="lbl">Projetor</span><span class="val">PROJ-005 — Epson 2250U</span></div>
    <div class="detail-item"><span class="lbl">Data</span><span class="val">09/06/2026</span></div>
    <div class="detail-item"><span class="lbl">Horário</span><span class="val">08:00 — 10:00</span></div>
    <div class="detail-item"><span class="lbl">Finalidade</span><span class="val">Aula de Física III</span></div>
    <div class="detail-item"><span class="lbl">Status</span><span class="val"><span class="tag tag-green">Aprovada</span></span></div>
  </div>
  <div class="btn-group"><button class="btn btn-success" onclick="alert('Retirada registrada! Projetor liberado para o professor.');location='dashboard-funcionario.html'">Confirmar Retirada</button><button class="btn btn-outline">Cancelar</button></div>
</div>
<div class="wireframe-label">Registrar Retirada</div>
</body>
</html>
