<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Solicitar Projetor — GAC</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="logo-mark">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
            </div>
            <span>GAC</span>
        </div>
        <div class="sidebar-section">Navegação</div>
        <nav>
            <a href="dashboard-professor.html">
                <span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></span>
                Dashboard
            </a>
            <a href="solicitar-projetor.html" class="active">
                <span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14"/><path d="M5 12h14"/></svg></span>
                Solicitar Projetor
            </a>
            <a href="minhas-solicitacoes.html">
                <span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg></span>
                Minhas Solicitações
            </a>
            <a href="consultar-disponibilidade.html">
                <span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/><path d="M8 2v4"/><path d="M16 2v4"/></svg></span>
                Disponibilidade
            </a>
            <a href="login.html" class="logout">
                <span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></span>
                Sair
            </a>
        </nav>
        <div class="sidebar-footer"><strong>João Silva</strong>Professor</div>
    </aside>
    <main class="main">
        <header>
            <div>
                <h1>Solicitar Projetor</h1>
                <div class="page-title-desc">Preencha os dados para solicitar um projetor.</div>
            </div>
            <span class="badge badge-prof">Professor</span>
        </header>
        <div class="form-card">
            <div class="form-row">
                <div class="form-group">
                    <label>Projetor</label>
                    <select>
                        <option>Qualquer disponível</option>
                        <option>PROJ-001 — Epson X51</option>
                        <option>PROJ-003 — BenQ MH535</option>
                        <option>PROJ-005 — Epson 2250U</option>
                        <option>PROJ-007 — Sony VPL-EX5</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Data de Uso</label>
                    <input type="date" value="2026-06-15">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Horário Início</label>
                    <input type="time" value="08:00">
                </div>
                <div class="form-group">
                    <label>Horário Fim</label>
                    <input type="time" value="10:00">
                </div>
            </div>
            <div class="form-group full">
                <label>Finalidade</label>
                <textarea placeholder="Descreva a finalidade do uso do projetor...">Aula de Cálculo II — Turma 2026.1</textarea>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="alert('Verificando disponibilidade...'); location='termo-responsabilidade.html'">Verificar Disponibilidade</button>
                <button class="btn btn-outline">Cancelar</button>
            </div>
        </div>
    </main>
</div>
<div class="wireframe-label">Solicitar Projetor</div>
</body>
</html>
